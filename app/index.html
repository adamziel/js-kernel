<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kernel Demo</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/xterm@5.3.0/css/xterm.css" />
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #000;
            font-family: monospace;
        }
        #terminal {
            width: 100vw;
            height: 100vh;
        }
    </style>
</head>
<body>
    <div id="terminal"></div>
    
    <script src="https://cdn.jsdelivr.net/npm/xterm@5.3.0/lib/xterm.js"></script>
    <script type="module">
        // Initialize xterm.js
        const term = new Terminal({
            cursorBlink: true,
            fontSize: 14,
            fontFamily: 'Menlo, Monaco, "Courier New", monospace',
            theme: {
                background: '#1e1e1e',
                foreground: '#d4d4d4',
                cursor: '#ffffff',
                black: '#000000',
                red: '#cd3131',
                green: '#0dbc79',
                yellow: '#e5e510',
                blue: '#2472c8',
                magenta: '#bc3fbc',
                cyan: '#11a8cd',
                white: '#e5e5e5',
                brightBlack: '#666666',
                brightRed: '#f14c4c',
                brightGreen: '#23d18b',
                brightYellow: '#f5f543',
                brightBlue: '#3b8eea',
                brightMagenta: '#d670d6',
                brightCyan: '#29b8db',
                brightWhite: '#e5e5e5'
            }
        });
        
        term.open(document.getElementById('terminal'));
        term.focus();

        const decoder = new TextDecoder();
        const toText = (value) => {
            if (typeof value === 'string') {
                return value;
            }
            if (value instanceof Uint8Array) {
                return decoder.decode(value);
            }
            if (value instanceof ArrayBuffer) {
                return decoder.decode(new Uint8Array(value));
            }
            if (Array.isArray(value)) {
                return decoder.decode(new Uint8Array(value));
            }
            return String(value ?? '');
        };
        
        // Initialize worker
        const worker = new Worker('./main-app.ts', {
            type: 'module'
        });
        
        // Callback for every keystroke - raw input sent directly to shell
        term.onData((data) => {
            // Send raw keystroke to worker's stdin
            worker.postMessage({ 
                type: 'stdin', 
                data: data 
            });
        });
        
        // Handle messages from worker
        worker.addEventListener('message', (event) => {
            const { type, data } = event.data;
            
            if (type === 'stdout') {
                term.write(toText(data));
            } else if (type === 'stderr') {
                term.write(toText(data));
            } else if (type === 'commandExit') {
                const exitCode = Number(data);
                if (!Number.isNaN(exitCode) && exitCode !== 0) {
                    term.write(`\r\n[process exited with code ${exitCode}]\r\n`);
                }
            } else if (type === 'exit') {
                term.write(`\r\nShell exited with code ${data}\r\n`);
            }
        });

        worker.addEventListener('error', (error) => {
            console.error('Worker error:', error);
            term.write(`\r\n\x1b[31mError: ${error.message}\x1b[0m\r\n`);
        });

        // Make terminal and worker available globally for debugging
        window.term = term;
        window.worker = worker;
    </script>
</body>
</html>
